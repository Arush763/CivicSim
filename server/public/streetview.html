  // Each patch with its neighbours, so one busy patch in a scattered edit doesn't win.
  const G = N / C;
  let best = -1;
  let centre = null;
  // Only patches that will be comfortably on screen after turning (not much more than ~40° down).
  for (let gy = 0; (gy + 0.5) / G < 0.7; gy++) {
    for (let gx = 0; gx < G; gx++) {
      let t = 0;
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const [x, y] = [gx + dx, gy + dy];
          if (x >= 0 && x < G && y >= 0 && y < G) t += grid[y * G + x];
        }
      }
      t += grid[gy * G + gx]; // the patch itself counts double
      if (t > best) [best, centre] = [t, [(gx + 0.5) / G, (gy + 0.5) / G]];
    }
  }
  return { changed: changed / (N * N), centre };
}

/** Turn the view to face what changed (in the direction where the most changed) and mark it. */
/** The direction (heading, pitch) and point of what changed most, from a spot's edited photos. */
function facing(shown) {
  const v = shown.reduce((a, b) => ((b.changed ?? b.coverage) > (a.changed ?? a.coverage) ? b : a));
  // The change's centre in that image, as a direction around you.
  const cam = viewCamera(v.heading, v.pitch, VIEW_FOV);
  cam.updateMatrixWorld(); // (rendering does this; here nothing has rendered with it yet)
  const world = new THREE.Vector3(v.centre[0] * 2 - 1, 1 - v.centre[1] * 2, 0.5).unproject(cam).sub(cam.position).normalize();
  const local = world.clone().applyQuaternion(carQuat().invert());
  const heading = (Math.atan2(local.x, -local.z) / D + 360) % 360;
  // A comfortable tilt: changes on the ground still show without staring at your feet.
  const pitch = Math.max(-25, Math.min(20, Math.asin(Math.max(-1, Math.min(1, local.y))) / D));
  return { heading, pitch, world, ops: v.ops };
}

function pointAt(shown) {
  const { heading, pitch, world, ops } = facing(shown);
  AI.mark = { world, label: ops.map((o) => OP_NAMES[o]).filter(Boolean).slice(0, 2).join(' · ') };
  const from = pano.getPov();
  const dh = ((((heading - from.heading) % 360) + 540) % 360) - 180;
  const show = () => {
    $('markerLabel').textContent = AI.mark?.label || 'What changes';
    $('marker').classList.remove('on');
    void $('marker').offsetWidth; // restart the animation
    $('marker').classList.add('on');
    syncMarker();
  };
  if (cover.on) {
    // Still covered: face the change before the view is revealed, rather than turning on screen.
    pano.setPov({ heading, pitch, zoom: from.zoom });
    return show();
  }
  if (holding || (Math.abs(dh) < 4 && Math.abs(pitch - from.pitch) < 4)) return show();
  const t0 = performance.now();
  const ms = Math.min(1400, 500 + Math.abs(dh) * 6);
  const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
  const stepTurn = () => {
    if (holding) return show(); // they grabbed the view: leave it where they put it
    const t = Math.min(1, (performance.now() - t0) / ms);
    const k = ease(t);
    pano.setPov({ heading: (from.heading + dh * k + 360) % 360, pitch: from.pitch + (pitch - from.pitch) * k });
    if (t < 1) requestAnimationFrame(stepTurn);
    else show();
  };
  requestAnimationFrame(stepTurn);
}

/** Keep the marker on the change while you look around (called from sync()). */
function syncMarker() {
  const el = $('marker');
  if (!AI.mark || !el.classList.contains('on')) return;
  const p = camera.position.clone().add(AI.mark.world.clone().multiplyScalar(VIEW_DIST)).project(camera);
  const visible = p.z < 1 && Math.abs(p.x) < 1.2 && Math.abs(p.y) < 1.2;
  el.style.visibility = visible ? 'visible' : 'hidden';
  el.style.left = `${((p.x + 1) / 2) * 100}%`;
  el.style.top = `${((1 - p.y) / 2) * 100}%`;
}
$('marker').addEventListener('animationend', () => $('marker').classList.remove('on'));
// Whether the person is holding the view (mouse or finger down), so we never turn it out from under them.
let holding = false;
window.addEventListener('pointerdown', () => (holding = true), true);
window.addEventListener('pointerup', () => (holding = false), true);
window.addEventListener('pointercancel', () => (holding = false), true);

fetch('/ai/status', { headers: TOKEN ? { authorization: `Bearer ${TOKEN}` } : {} })
  .then((r) => r.json())
  .then((s) => {
    AI.enabled = !!s.enabled;
    AI.canGenerate = !!s.canGenerate;
    // Preparing without photo-real (not set up, or not asked for): only the petition snapshots.
    if (PREPARE && (!AI.enabled || !AI.on)) {
      cover.hide();
      return void snapOnly(AI.enabled ? 'photo-real views were not asked for' : 'photo-real is not set up');
    }
    if (!AI.on) return; // the viewer turned photo-real off: plain Street View
    if (!AI.enabled) {
      cover.say('Photo-real views aren’t set up on the server.', { spin: false });
      return flashChip('Photo-real views aren’t set up on the server.');
    }
    // The zone's saved edits first, so spots that are ready just load.
    return editsLoaded.then(() => {

      if (PREPARE) void prepareRun();

  .catch(() => cover.say('The server couldn’t be reached.', { spin: false, action: { label: 'Try again', run: () => location.reload() } }));

// ------------------------------------------------------------------ lining lanes up with the road
// OpenStreetMap centre lines are often a metre or two off. But Street View photos are taken from a
// car driving in a lane: mid-road on a one-lane street, in the right-hand lane of a two-way road
// (left-hand where traffic keeps left). Where we can tell which lane the car is in, slide the new
// street markings sideways so the road lines up with the camera. Buildings stay put.
const KEEP_LEFT = [ // rough boxes of places that drive on the left
  [-10.7, 49.8, 1.8, 60.9], [122, 24, 146, 46], [112, -44, 154, -10], [166, -47.5, 179, -34], [68, 6, 97.5, 35.7],
  [16, -35, 33, -22], [97, 5, 106, 21], [99, 1, 119.5, 7.5], [95, -11, 141, 6], [113.8, 22.1, 114.5, 22.6],
];
const drivesLeft = ([lng, lat]) => KEEP_LEFT.some(([w, s, e, n]) => lng >= w && lng <= e && lat >= s && lat <= n);
const STREET_NODES = new Set(['bike', 'bus', 'buffer', 'lane_line', 'post', 'sidewalk', 'sidewalk_new', 'road', 'bike_path']);
const moving = []; // [object, original position]
let streetProps = [];

function alignStreets() {
  if (!pano || !origin || !streetProps.length || !moving.length) return;
  const pos = pano.getPosition();
  if (!pos) return;
  const [cx, cn] = project([pos.lng(), pos.lat()]);
  let best = null;
  for (const st of streetProps) {
    for (let i = 0; i < st.line.length - 1; i++) {
      const [ax, an] = st.line[i];
      const [bx, bn] = st.line[i + 1];
      const len = Math.hypot(bx - ax, bn - an) || 1;
      const dir = [(bx - ax) / len, (bn - an) / len];
      const t = Math.max(0, Math.min(len, (cx - ax) * dir[0] + (cn - an) * dir[1]));
      const fx = ax + dir[0] * t, fn = an + dir[1] * t;
      const d = Math.hypot(cx - fx, cn - fn);
      const u = dir[0] * (cn - an) - dir[1] * (cx - ax); // + = left of the line's direction
      if (!best || d < best.d) best = { st, dir, u, d };
    }
  }
  let shift = 0;
  if (best && Math.abs(best.u) < best.st.halfRoad + 1.5) {
    const { st, dir, u } = best;
    const uMin = -(st.halfRoad - st.parkRight);
    const uMax = st.halfRoad - st.parkLeft;
    let expected = null;
    if (st.oneway && st.travelLanes <= 1) expected = (uMin + uMax) / 2;
    else if (!st.oneway && st.travelLanes === 2) {
      const car = pano.getPhotographerPov?.()?.heading ?? pano.getPov().heading;
      const along = Math.sin(car * D) * dir[0] + Math.cos(car * D) * dir[1] > 0;
      const mid = (uMin + uMax) / 2;
      // Keeping right while driving along the line puts you on its right (negative) half.
      const negativeHalf = along !== drivesLeft([pos.lng(), pos.lat()]);
      expected = negativeHalf ? (uMin + mid) / 2 : (mid + uMax) / 2;
    }
    if (expected !== null && Math.abs(u - expected) < 2.5) shift = u - expected;
    const normal = new THREE.Vector3(-dir[1], 0, -dir[0]); // left of the line, in world space (z = −north)
    for (const [o, base] of moving) o.position.copy(base).addScaledVector(normal, shift);
  } else {
    for (const [o, base] of moving) o.position.copy(base);
  }
  window.__svDebug && (window.__svDebug.laneShift = Math.round(shift * 100) / 100);
}

// Handle for automated checks (camera state, scene).
window.__svDebug = {
  get pano() { return pano; }, camera, scene, sync, get origin() { return origin; }, AI, panoGroup,
  /** Guide for one Street View direction, for offline prompt experiments. */

// ?ui=0: the phone app draws its own Before/Compare/After switch and drives the page through
// window.__sv (injected JavaScript). ?photo=0: the viewer turned photo-real views off in the app,
// so this is plain Street View.
if (q.get('ui') === '0') document.body.classList.add('noui');
if (q.get('photo') === '0') {
  AI.on = false;
  cover.hide();
}
window.__sv = { setMode: (m) => setMode(m), setSplit: (f) => setSplit(f) };

/**
 * Snapshots (?snaps=1 with prepare): the server's hidden browser takes still pictures of the
 * request for its petition. It draws the 3D model shots through model3d() as soon as the model is
 * in. Once the edits are made, the page shows the viewpoint nearest the change photo-real
 * (firstSpot) and waits while the server screenshots it (done).
 */
async function snapPause() {
  if (!SNAPS) return;
  cover.hide();
  pano.setOptions({ linksControl: false }); // no walk arrows in the pictures
  SNAP.firstSpot = { photo: (AI.shown?.length ?? 0) > 0 };
  await until(() => SNAP.done, 180000).catch(() => {});
  pano.setOptions({ linksControl: true });
  setMode('after');
  pano.setZoom(1);
}
/** After preparing: go to the prepared viewpoint nearest the change, show its edits, take the pictures. */
async function snapAtViewpoint() {
  if (!SNAPS) return;
  await refreshEdits();
  let best = null;
  let bestD = Infinity;
  for (const [id, list] of EDITS) {
    const at = list.find((e) => e.at)?.at;
    const d = at ? distM(at, AT) : Infinity;
    if (list.length && d < bestD) [best, bestD] = [id, d];
  }
  if (best) {
    if (pano.getPano() !== best) {
      pano.setPano(best);
      await until(() => pano.getPano() === best && pano.getPosition()).catch(() => {});
      await wait(1000);
    }
    sync();
    await runAi().catch(() => {}); // loads the saved edits (nothing new is made)
  }
  await snapPause();
}
/** No photo-real views to prepare: just the snapshots, then report why nothing was prepared. */
async function snapOnly(why) {
  try {
    if (SNAPS) {
      await until(() => pano && pano.getPosition() && model && origin, 90000);
      await wait(1000);
      await snapPause();
    }
  } catch { /* nothing to show */ }
  window.__prepared = { done: true, error: why };
}
Object.assign(SNAP, {
  /** Face the change: where the photo-real edits changed most, else toward where the change is. */
  face(zoom = 1) {
    const pos = pano.getPosition();
    const f = AI.shown?.length && mode !== 'before' ? facing(AI.shown) : null;
    const here = [pos.lng(), pos.lat()];
    pano.setPov({ heading: f ? f.heading : distM(here, AT) > 4 ? bearing(here, AT) : pano.getPov().heading, pitch: f ? f.pitch : -6 });
    pano.setZoom(zoom);
    sync();
  },
  /** Along the street, wide: down the street the change runs along, else toward the change. */
  street() {
    const pos = pano.getPosition();
    const here = [pos.lng(), pos.lat()];
    pano.setPov({ heading: LOOK ?? bearing(here, AT), pitch: -4 });
    pano.setZoom(0.7);
    sync();
  },
  setMode: (m) => setMode(m),
  /** The request's 3D model from above ('top') or at an angle ('angled'), as base64 JPEG. */
  async model3d(view) {
    const gltf = await new GLTFLoader().loadAsync(GLB);
    const s = new THREE.Scene();
    s.background = new THREE.Color(0xdfe7ef);
    s.add(new THREE.HemisphereLight(0xffffff, 0x8a8170, 1.6));
    const light = new THREE.DirectionalLight(0xffffff, 2.2);
    light.position.set(-300, 500, 200);
    s.add(light, gltf.scene);
    const [x, n] = project(AT);
    const cam = new THREE.PerspectiveCamera(45, 4 / 3, 1, 5000);
    if (view === 'top') cam.position.set(x, 240, -n + 0.01);
    else cam.position.set(x - 95, 105, -n + 125);
    cam.lookAt(x, 0, -n);
    const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    r.outputColorSpace = THREE.SRGBColorSpace;
    r.setSize(800, 600, false);
    r.render(s, cam);
    const jpeg = r.domElement.toDataURL('image/jpeg', 0.82).split(',')[1];
    r.dispose();
    return jpeg;
  },
});
window.__snap = SNAP;

window.gm_authFailure = () => fail('error', 'Google rejected the Maps API key. Check that it allows the Maps JavaScript API and this page’s address.');
window.__svInit = () => {
  start().catch((e) => fail('error', String(e?.message || e)));
};
loadModel().catch((e) => {
  cover.say('The change could not be loaded.', { spin: false, action: { label: 'Try again', run: () => location.reload() } });
  $('chip').textContent = 'The 3D model could not be loaded';
  tell('error', `model: ${e?.message || e}`);
});

const s = document.createElement('script');
s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(KEY)}&v=weekly&loading=async&callback=__svInit`;
s.async = true;
s.onerror = () => fail('error', 'Google Maps could not be loaded. Check the internet connection.');
document.head.appendChild(s);
</script>
</body>
</html>
