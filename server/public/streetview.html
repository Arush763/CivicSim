<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Street View: before and after</title>
<!--
  Street View before/after for one request. Google's panorama is the real street ("before");
  the request's 3D model is drawn over it in a transparent three.js layer whose camera follows
  the panorama ("after"). Existing buildings are drawn invisibly into the depth buffer so new
  things behind them are hidden, the way they would be in real life.

  Query: glb (after-model URL), at=lng,lat (where the change is), look=heading, pitch, zoom
         (optional starting view), ops=type,type (what changes), mode=after|before|compare,
         ui=0 (the phone app shows its own mode switch and drives window.__sv), photo=0 (no
         photo-real views), snaps=1 (with prepare: pause for the server's petition snapshots)
  Tells its host (iframe parent or React Native WebView) {source:'streetview', status, message}.
-->
<style>
  :root { --text: #202124; --muted: #5F6368; --accent: #1A73E8; --card: #FFFFFF; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #E8EAED; font-family: Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif; }
  #pano, #overlay, #paint { position: absolute; inset: 0; width: 100%; height: 100%; }
  #pano { z-index: 0; } /* own stacking context, so Google's z-indexed layers stay under the model */
  #overlay, #paint { z-index: 1; pointer-events: none; opacity: 0; transition: opacity 0.35s ease; }
  /* Road paint blends with the photo (hard-light), so asphalt texture and traffic show through it. */
  #paint { mix-blend-mode: hard-light; }
  /* A touch of softness so crisp computer edges sit in a slightly soft photo. */
  #overlay { filter: blur(0.3px) saturate(0.94); }
  #overlay.on, #paint.on { opacity: 1; }
  body.walking #overlay, body.walking #paint { opacity: 0; transition: opacity 0.12s ease; }
  .bar { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--card); box-shadow: 0 1px 3px rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15); z-index: 5; }
  .bar button { border: 0; background: transparent; color: var(--muted); font: 500 13px/1 inherit; font-family: inherit; padding: 9px 14px; border-radius: 999px; cursor: pointer; min-height: 34px; }
  .bar button[aria-pressed="true"] { background: #E8F0FE; color: var(--accent); }
  .chip { position: absolute; left: 12px; bottom: 12px; max-width: calc(100% - 24px); background: rgba(255,255,255,.92); color: var(--muted); font-size: 12px; padding: 6px 10px; border-radius: 999px; z-index: 5; pointer-events: none; box-shadow: 0 1px 2px rgba(60,64,67,.3); }
  #divider { position: absolute; top: 0; bottom: 0; width: 44px; margin-left: -22px; z-index: 4; cursor: ew-resize; display: none; touch-action: none; }
  #divider::before { content: ''; position: absolute; left: 21px; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 4px rgba(0,0,0,.4); }
  #divider::after { content: '‹ ›'; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 36px; height: 36px; border-radius: 50%; background: #fff; color: var(--text); font: 700 14px/36px inherit; font-family: inherit; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .side { position: absolute; top: 58px; z-index: 4; background: rgba(32,33,36,.72); color: #fff; font-size: 11px; font-weight: 500; letter-spacing: .4px; padding: 4px 8px; border-radius: 6px; pointer-events: none; display: none; }
  /* Photo-real (AI) photos of this spot, wrapped around you: above Google's panorama. Once they're
     up, they show the change built into the real street. */
  #photo { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; opacity: 0; transition: opacity 0.6s ease; }
  #photo.on { opacity: 1; }
  /* The 3D model is only used behind the scenes (to guide the AI edits); shown only with ?debug=1. */
  body:not(.debug) #overlay, body:not(.debug) #paint { display: none; }
  /* Progress while the photo-real view of a spot is being made: how far along, and about how long is left. */
  #progress { position: absolute; left: 50%; bottom: 48px; transform: translateX(-50%); width: min(360px, calc(100% - 32px)); box-sizing: border-box; background: rgba(255,255,255,.96); color: var(--text); border-radius: 12px; padding: 10px 14px 12px; font-size: 13px; z-index: 5; pointer-events: none; box-shadow: 0 1px 3px rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15); opacity: 0; transition: opacity 0.3s ease; }
  #progress.on { opacity: 1; }
  #progress .row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; font-weight: 500; }
  #progress .left { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #progress .track { height: 6px; border-radius: 3px; background: #E8EAED; overflow: hidden; }
  #progress .fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s linear; }
  #progress .sub { margin-top: 6px; color: var(--muted); font-size: 12px; }
  /* Until the photo-real view is ready, the plain Street View is covered (it would look like nothing
     changed). The progress card sits in the middle of the cover. */
  #cover { position: absolute; inset: 0; z-index: 4; background: #E8EAED; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
  body.covered #cover { opacity: 1; pointer-events: auto; }
  #coverText { position: absolute; left: 16px; right: 16px; max-width: 480px; margin: 0 auto; top: calc(50% - 86px); transform: translateY(-50%); line-height: 1.45; text-align: center; color: var(--text); font-size: 15px; font-weight: 500; }
  #coverText .spin { display: inline-block; width: 12px; height: 12px; margin-right: 8px; border: 2px solid var(--accent); border-right-color: transparent; border-radius: 50%; vertical-align: -1px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #coverAction { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; border: 0; background: var(--accent); color: #fff; font: 500 14px/1 inherit; font-family: inherit; padding: 11px 20px; border-radius: 999px; cursor: pointer; }
  body.covered #progress { z-index: 6; top: 50%; bottom: auto; transform: translate(-50%, -50%); }
  body.covered .bar, body.covered .chip, body.covered #marker { visibility: hidden; }
  /* Once it's ready, the view turns to the change and this ring marks it for a moment. */
  #marker { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; z-index: 3; pointer-events: none; display: none; }
  #marker.on { display: block; animation: ping 3.2s ease-out forwards; }
  #marker::before { content: ''; position: absolute; inset: 0; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 2px var(--accent), 0 2px 10px rgba(0,0,0,.45); }
  #marker span { position: absolute; left: 50%; top: 74px; transform: translateX(-50%); white-space: nowrap; background: var(--accent); color: #fff; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  @keyframes ping { 0% { opacity: 0; transform: scale(.5); } 12% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
  body.walking #photo { opacity: 0; transition: opacity 0.12s ease; }
  /* ?ui=0: the phone app draws its own Before/Compare/After switch over the page, at the bottom. */
  body.noui .bar { display: none; }
  body.noui .chip { bottom: 64px; }
  body.noui .side { top: 112px; } /* below the app's back and full-screen buttons */
  /* Snapshots for petitions (taken by the server's hidden browser): just the street. */
  body.snap .chip, body.snap #marker, body.snap #progress, body.snap .side, body.snap #divider, body.snap .bar { visibility: hidden; }
  #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; color: var(--muted); font-size: 14px; z-index: 6; background: #F1F3F4; }
</style>
</head>
<body class="covered">
<div id="pano"></div>
<canvas id="paint"></canvas>
<canvas id="overlay"></canvas>
<div id="divider" role="slider" aria-label="Compare before and after" aria-valuemin="0" aria-valuemax="100"></div>
<div class="side" id="lblBefore" style="left: 12px">BEFORE</div>
<div class="side" id="lblAfter" style="right: 12px">AFTER</div>
<div class="bar" role="group" aria-label="Show">
  <button data-mode="before">Before</button>
  <button data-mode="compare">Compare</button>
  <button data-mode="after">After</button>
</div>
<canvas id="photo"></canvas>
<div class="chip" id="chip">Loading Street View…</div>
<div id="cover"><div id="coverText"><span class="spin"></span>Getting the view with the change ready…</div><button id="coverAction" type="button"></button></div>
<div id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Photo-real view progress">
  <div class="row"><span id="progTitle">Building the photo-real view</span><span class="left" id="progLeft"></span></div>
  <div class="track"><div class="fill" id="progFill"></div></div>
  <div class="sub" id="progSub"></div>
</div>
<div id="marker"><span id="markerLabel"></span></div>
<div id="msg"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const KEY = /*MAPS_KEY*/''; // filled in by the server from GOOGLE_MAPS_BROWSER_KEY
// The signed-in person's token, from after the # so it's never sent in a URL or logged. Renders need it once Supabase is on.
const TOKEN = new URLSearchParams(location.hash.slice(1)).get('token');
const GLB = q.get('glb');
const AT = (q.get('at') || '').split(',').map(Number); // [lng, lat]
const LOOK = q.has('look') ? Number(q.get('look')) : null;
const PITCH = q.has('pitch') ? Number(q.get('pitch')) : 2;
const ZOOM = q.has('zoom') ? Number(q.get('zoom')) : 1;
const OPS = new Set((q.get('ops') || '').split(',').filter(Boolean));
const DESC = q.get('desc') || [...OPS].join(', ').replace(/_/g, ' ');
const SNAPS = q.get('snaps') === '1';
const SNAP = { modelReady: false, firstSpot: null, done: false }; // petition snapshots, see snapPause()
const EYE = 2.5; // Street View cameras sit about 2.5 m above the street
const D = Math.PI / 180;
const R = 6371008.8;

const $ = (id) => document.getElementById(id);
const tell = (status, message) => {
  const m = JSON.stringify({ source: 'streetview', status, message });
  window.ReactNativeWebView?.postMessage(m);
  if (window.parent !== window) window.parent.postMessage(m, '*');
};
const fail = (status, text) => {
  $('msg').textContent = text;
  $('msg').style.display = 'flex';
  tell(status, text);
  cover.hide();
};

/**
 * The loading cover. In After (and Compare) the plain Street View is never shown on its own: it
 * would look like nothing changed. The page opens covered and is only revealed once the photo-real
 * edits are up. Until then (still being prepared, today's limit reached, an error) the cover says
 * why. Walking to a spot that has to be built covers it again, after a moment (prepared spots load
 * before that).
 */
const COVER_LOADING = 'Getting the view with the change ready…';
const cover = {
  on: true,
  timer: 0,
  show(delayMs = 0) {
    clearTimeout(this.timer);
    if (!delayMs) return this.set(true);
    this.timer = setTimeout(() => this.set(true), delayMs);
  },
  /** Cancel a cover that's about to appear (without lifting one that's up). */
  cancel() {
    clearTimeout(this.timer);
  },
  hide() {
    clearTimeout(this.timer);
    this.set(false);
  },
  set(on) {
    this.on = on;
    document.body.classList.toggle('covered', on);
  },
  /** Cover the view with a message: a spinner while something is on its way, or a button to act. */
  say(text, { spin = true, action = null } = {}) {
    $('coverText').innerHTML = spin ? '<span class="spin"></span>' : '';
    $('coverText').append(text);
    const b = $('coverAction');
    b.style.display = action ? 'block' : 'none';
    if (action) {
      b.textContent = action.label;
      b.onclick = action.run;
    }
    this.show();
  },
};

// ------------------------------------------------------------------ three.js layers
// Two canvases over the panorama:
//  - #paint, blended with CSS hard-light: road paint, lines, symbols, grass and the shadows of
//    new things. Hard-light keeps the photo's own texture (asphalt grain, wear, traffic) under
//    the paint. Its background is 50% grey, which hard-light leaves unchanged.
//  - #overlay, normal blending: solid new things (posts, trees, buildings, sidewalk), lit by a
//    sun placed for this place and season, with reflections for glass.
const canvas = $('overlay');
const paintCanvas = $('paint');
const makeRenderer = (c, clear, clearAlpha) => {
  const r = new THREE.WebGLRenderer({ canvas: c, alpha: true, antialias: true, premultipliedAlpha: false });
  r.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  r.setClearColor(clear, clearAlpha);
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.0;
  r.shadowMap.enabled = true;
  r.shadowMap.type = THREE.PCFSoftShadowMap;
  return r;
};
const renderer = makeRenderer(canvas, 0x000000, 0);
const paintRenderer = makeRenderer(paintCanvas, 0x808080, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.3, 3000);
camera.rotation.order = 'YXZ';

scene.add(new THREE.HemisphereLight(0xdde6f2, 0x5a5550, 1.1));
const sun = new THREE.DirectionalLight(0xfff1e0, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 400 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
let sunDir = new THREE.Vector3(-0.4, 0.75, 0.5).normalize();
{
  // Soft studio-like reflections so window glass reads as glass.
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.55;
}

let origin = null; // [lng, lat] of the model's local frame
let SETTING = 'urban'; // urban | suburban | rural, from the render (shapes how changes are built)
const project = ([lng, lat]) => [
  (lng - origin[0]) * D * R * Math.cos(origin[1] * D),
  (lat - origin[1]) * D * R,
];
/** Local meters (x east, n north) → three.js world (y up, z south). */
const world = (x, n, y = 0) => new THREE.Vector3(x, y, -n);

/** Sun direction for a latitude and month, mid-afternoon (Street View photos are mostly daytime). */
function sunFor(lat, month) {
  const day = (month - 1) * 30.4 + 15;
  const decl = 23.44 * Math.sin(((2 * Math.PI) / 365) * (284 + day)) * D;
  const phi = lat * D;
  const H = 30 * D; // 14:00 solar time
  const elev = Math.asin(Math.sin(phi) * Math.sin(decl) + Math.cos(phi) * Math.cos(decl) * Math.cos(H));
  const az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(decl) * Math.cos(phi)) + Math.PI; // from north
  const e = Math.max(elev, 12 * D);
  return new THREE.Vector3(Math.sin(az) * Math.cos(e), Math.sin(e), -Math.cos(az) * Math.cos(e)).normalize();
}

// ---------------------------------------------------------------- textures drawn in code
function canvasTexture(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

/** NYC-style bike lane symbol: rider on a bicycle with an arrow ahead. Texture "up" = direction of travel. */
const bikeStencil = canvasTexture(256, 512, (g, w, h) => {
  g.strokeStyle = g.fillStyle = '#ffffff';
  g.lineCap = g.lineJoin = 'round';
  g.lineWidth = 16;
  // Seen from a low angle, road symbols are drawn stretched along the lane.
  const wheel = (x, y) => { g.beginPath(); g.ellipse(x, y, 48, 70, 0, 0, Math.PI * 2); g.stroke(); };
  wheel(128, 430);
  wheel(128, 250);
  g.beginPath(); g.moveTo(128, 430); g.lineTo(128, 330); g.lineTo(128, 250); g.stroke(); // frame
  g.beginPath(); g.moveTo(128, 330); g.lineTo(150, 300); g.stroke();
  g.beginPath(); g.arc(128, 300, 22, 0, Math.PI * 2); g.fill(); // rider
  // Arrow
  g.beginPath(); g.moveTo(128, 150); g.lineTo(128, 70); g.stroke();
  g.beginPath(); g.moveTo(80, 100); g.lineTo(128, 20); g.lineTo(176, 100); g.closePath(); g.fill();
});

/** "BUS ONLY", stretched along the lane; "BUS" is nearest the driver. */
const busStencil = canvasTexture(256, 1024, (g, w, h) => {
  g.fillStyle = '#ffffff';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.font = 'bold 150px Arial, Helvetica, sans-serif';
  const word = (text, y) => { g.save(); g.translate(w / 2, y); g.scale(0.62, 2.6); g.fillText(text, 0, 0); g.restore(); };
  word('ONLY', 260);
  word('BUS', 760);
});

/** A cluster of leaves on transparent, for tree canopies. */
const leafTexture = canvasTexture(128, 128, (g) => {
  // A loose spray of small leaves on twigs, in muted, natural greens (gaps let the sky through).
  g.strokeStyle = 'rgba(70,58,40,0.9)';
  g.lineWidth = 1.5;
  for (let t = 0; t < 4; t++) {
    g.beginPath(); g.moveTo(64, 64); g.lineTo(64 + (Math.random() - 0.5) * 100, 64 + (Math.random() - 0.5) * 100); g.stroke();
  }
  for (let i = 0; i < 70; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.sqrt(Math.random()) * 52;
    g.fillStyle = `hsl(${78 + Math.random() * 34}, ${22 + Math.random() * 22}%, ${16 + Math.random() * 22}%)`;
    g.beginPath();
    g.ellipse(64 + Math.cos(a) * r, 64 + Math.sin(a) * r, 5.5 + Math.random() * 2, 3 + Math.random(), Math.random() * Math.PI, 0, Math.PI * 2);
    g.fill();
  }
});

// ---------------------------------------------------------------- terrain
// Ground heights around the zone (from /terrain), so everything follows hills. Every material in
// the scene gets lifted by the ground height under it in its vertex shader (see applyTerrain).
const terrainUniforms = {
  uTerrain: { value: new THREE.DataTexture(new Uint16Array([0]), 1, 1, THREE.RedFormat, THREE.HalfFloatType) },
  uTerrainHalf: { value: 320 },
  uTerrainSize: { value: 1 },
  uTerrainOn: { value: 0 },
};
const TERRAIN_GLSL = `
  uniform sampler2D uTerrain; uniform float uTerrainHalf; uniform float uTerrainSize; uniform float uTerrainOn;
  float terrainAt(vec2 xz) {
    if (uTerrainOn < 0.5) return 0.0;
    vec2 g = (vec2(xz.x, -xz.y) + uTerrainHalf) / (2.0 * uTerrainHalf) * (uTerrainSize - 1.0);
    return texture2D(uTerrain, clamp((g + 0.5) / uTerrainSize, 0.0, 1.0)).r;
  }`;
// Instanced things (trees, posts, symbols) move as a whole to the ground at their base; everything
// else is lifted vertex by vertex.
const TERRAIN_VERTEX = `
  #ifdef USE_INSTANCING
    mat4 tModel = modelMatrix * instanceMatrix;
    vec4 tAt = tModel * vec4(0.0, 0.0, 0.0, 1.0);
  #else
    mat4 tModel = modelMatrix;
    vec4 tAt = tModel * vec4(transformed, 1.0);
  #endif
  transformed += (inverse(tModel) * vec4(0.0, terrainAt(tAt.xz), 0.0, 0.0)).xyz;`;
const terrain = { heights: null, half: 320, size: 1 };
/** Ground height (m, relative to the model origin) at local x east, n north. */
function groundAt(x, n) {
  if (!terrain.heights) return 0;
  const { heights, half, size } = terrain;
  const gx = Math.min(size - 1.001, Math.max(0, ((x + half) / (2 * half)) * (size - 1)));
  const gy = Math.min(size - 1.001, Math.max(0, ((n + half) / (2 * half)) * (size - 1)));
  const x0 = Math.floor(gx), y0 = Math.floor(gy), fx = gx - x0, fy = gy - y0;
  const h = (c, r) => heights[r * size + c];
  return (h(x0, y0) * (1 - fx) + h(x0 + 1, y0) * fx) * (1 - fy) + (h(x0, y0 + 1) * (1 - fx) + h(x0 + 1, y0 + 1) * fx) * fy;
}
const terrainReady = new WeakSet();
function withTerrain(m) {
  if (!m || terrainReady.has(m)) return m;
  terrainReady.add(m);
  if (m.isShaderMaterial) {
    Object.assign(m.uniforms, terrainUniforms);
    m.vertexShader = TERRAIN_GLSL + m.vertexShader.replace('vec4 w = modelMatrix * vec4(position, 1.0);', 'vec4 w = modelMatrix * vec4(position, 1.0); w.y += terrainAt(w.xz);');
    m.needsUpdate = true;
    return m;
  }
  const prev = m.onBeforeCompile;
  m.onBeforeCompile = (shader, r) => {
    prev.call(m, shader, r);
    Object.assign(shader.uniforms, terrainUniforms);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>\n${TERRAIN_GLSL}`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>\n${TERRAIN_VERTEX}`);
  };
  const key = m.customProgramCacheKey.bind(m);
  m.customProgramCacheKey = () => `terrain:${m.uuid}:${key()}`;
  m.needsUpdate = true;
  return m;
}
/** Give every mesh under `root` terrain, including the depth pass its shadow is drawn from. */
function applyTerrain(root) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    o.material = withTerrain(o.material);
    if (o.castShadow && !o.customDepthMaterial) {
      const src = o.material;
      o.customDepthMaterial = withTerrain(new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: src.map ?? null, alphaTest: src.alphaTest ?? 0 }));
    }
  });
}
async function loadTerrain(areaId) {
  try {
    const t = await (await fetch(`/terrain/${encodeURIComponent(areaId)}`)).json();
    if (!Array.isArray(t.heights)) return;
    Object.assign(terrain, { heights: t.heights, half: t.halfM, size: t.size });
    const tex = new THREE.DataTexture(Uint16Array.from(t.heights, (h) => THREE.DataUtils.toHalfFloat(h)), t.size, t.size, THREE.RedFormat, THREE.HalfFloatType);
    tex.magFilter = tex.minFilter = THREE.LinearFilter;
    tex.needsUpdate = true;
    terrainUniforms.uTerrain.value = tex;
    terrainUniforms.uTerrainHalf.value = t.halfM;
    terrainUniforms.uTerrainSize.value = t.size;
    terrainUniforms.uTerrainOn.value = 1;
    requestSync();
  } catch {
    /* flat ground it is */
  }
}

// ---------------------------------------------------------------- materials
const NOISE_GLSL = `
  float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float noise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
  }
  float fbm(vec2 p) { return noise(p) * 0.55 + noise(p * 2.7) * 0.28 + noise(p * 9.1) * 0.17; }`;

/**
 * Thermoplastic road paint, worn in patches like the real thing. Colours are in the hard-light
 * layer's terms: above mid-grey brightens the photo, below darkens it.
 */
function paintMaterial(hex, hex2 = hex, wear = 0.35) {
  return new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    polygonOffset: true,
    polygonOffsetFactor: -2,
    uniforms: { uA: { value: new THREE.Color(hex) }, uB: { value: new THREE.Color(hex2) }, uWear: { value: wear } },
    vertexShader: `varying vec3 vW; void main() { vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `uniform vec3 uA; uniform vec3 uB; uniform float uWear; varying vec3 vW; ${NOISE_GLSL}
      void main() {
        vec2 p = vW.xz;
        float worn = smoothstep(0.55, 0.9, fbm(p * 0.45)) * uWear + smoothstep(0.7, 1.0, noise(p * 14.0)) * 0.25;
        vec3 c = mix(uA, uB, fbm(p * 1.7));
        gl_FragColor = vec4(c, clamp(0.97 - worn, 0.0, 1.0));
      }`,
  });
}
// THREE.Color(hex) converts sRGB → linear; the paint shader writes straight to the sRGB canvas,
// so give it the sRGB values back.
const srgb = (m) => { for (const k of ['uA', 'uB']) m.uniforms[k].value.convertLinearToSRGB(); return m; };

const PAINT_LOOKS = {
  // A muted thermoplastic green (hard-light: this lands on grey asphalt as a dull, worn green).
  bike: srgb(paintMaterial(0x6c9a77, 0x73a07c, 0.4)),
  bus: srgb(paintMaterial(0xb0483f, 0xa94540, 0.3)),
  lane_line: srgb(paintMaterial(0xf4f4f0, 0xeeeeea, 0.45)),
  marking: srgb(paintMaterial(0xf4f4f0, 0xeeeeea, 0.45)),
  park_new: srgb(paintMaterial(0x6f9a46, 0x8fb35c, 0.0)),
};
const stencilMaterial = (map) => new THREE.MeshBasicMaterial({ map, transparent: true, depthWrite: false, toneMapped: false, color: 0xf2f2f2, polygonOffset: true, polygonOffsetFactor: -4 });
const pitMaterial = new THREE.MeshBasicMaterial({ color: 0x3b3029, toneMapped: false, transparent: true, opacity: 0.85, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -3 });

/** Building facade: stone with storeys, framed reflective windows and a glass shopfront, from world position (no UVs needed). */
function facadeMaterial() {
  const m = new THREE.MeshStandardMaterial({ color: 0xd2c8b8, roughness: 0.85, metalness: 0.0 });
  m.onBeforeCompile = (shader) => {
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWorld;\nvarying vec3 vWN;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;\nvWorld.y -= terrainAt(vWorld.xz); // storeys count from the ground\nvWN = normalize(mat3(modelMatrix) * objectNormal);');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>\nvarying vec3 vWorld;\nvarying vec3 vWN;\n${NOISE_GLSL}`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        float isWin = 0.0;
        if (abs(vWN.y) < 0.5) {
          vec2 t = normalize(vec2(-vWN.z, vWN.x));
          float u = dot(vWorld.xz, t);
          float y = vWorld.y;
          // Brick: 21.5 × 6.5 cm courses, staggered, each brick a slightly different colour. Fades
          // to the average colour where bricks get smaller than a pixel, so it doesn't shimmer.
          vec2 bc = vec2(u / 0.225 + 0.5 * mod(floor(y / 0.075), 2.0), y / 0.075);
          vec2 bf = fract(bc);
          float mortar = max(step(bf.x, 0.06), step(bf.y, 0.14));
          float detail = 1.0 - clamp(max(fwidth(bc.x), fwidth(bc.y)) * 1.5 - 0.5, 0.0, 1.0);
          vec3 brick = vec3(0.47, 0.25, 0.18) * (0.82 + 0.3 * hash(floor(bc))) * (0.92 + 0.12 * fbm(vec2(u, y) * 0.8));
          vec3 wall = mix(vec3(0.43, 0.27, 0.21), mix(brick, vec3(0.62, 0.6, 0.56), mortar), detail);
          diffuseColor.rgb = wall;
          bool ground = y < 4.5;
          float fy = ground ? y / 4.5 : fract((y - 4.5) / 3.2);
          float fu = fract(u / (ground ? 3.0 : 2.4));
          if (ground) {
            // Shopfront: dark frames, big panes, a sign band, stone base.
            bool frameG = fy > 0.04 && fy < 0.82 && fu > 0.02 && fu < 0.98;
            bool glass = fy > 0.07 && fy < 0.79 && fu > 0.05 && fu < 0.95 && abs(fu - 0.5) > 0.012;
            if (frameG) diffuseColor.rgb = vec3(0.08, 0.1, 0.09);
            if (glass) { diffuseColor.rgb = vec3(0.05, 0.06, 0.07); isWin = 1.0; }
            if (fy > 0.84 && fy < 0.97) diffuseColor.rgb = vec3(0.16, 0.16, 0.17);
            if (fy < 0.04) diffuseColor.rgb = vec3(0.6, 0.58, 0.54);
          } else {
            // Sash windows: stone lintel and sill, white frame, glazing bars.
            bool lintel = fy > 0.86 && fy < 0.92 && fu > 0.22 && fu < 0.78;
            bool sill = fy > 0.18 && fy < 0.22 && fu > 0.22 && fu < 0.78;
            bool frame = fy > 0.22 && fy < 0.86 && fu > 0.25 && fu < 0.75;
            bool pane = fy > 0.25 && fy < 0.83 && fu > 0.28 && fu < 0.72 && abs(fy - 0.54) > 0.012 && abs(fu - 0.5) > 0.01;
            if (lintel || sill) diffuseColor.rgb = vec3(0.66, 0.63, 0.58);
            if (frame) diffuseColor.rgb = vec3(0.86, 0.85, 0.82);
            if (pane) {
              float id = hash(floor(vec2(u / 2.4, (y - 4.5) / 3.2)));
              // Some windows show blinds or a lit room; most reflect the sky.
              diffuseColor.rgb = id > 0.85 ? vec3(0.62, 0.55, 0.42) : id > 0.7 ? vec3(0.55, 0.53, 0.5) : vec3(0.05, 0.07, 0.09);
              isWin = id > 0.7 ? 0.0 : 1.0;
            }
            if (fy < 0.035) diffuseColor.rgb = vec3(0.6, 0.58, 0.54); // stone band at each floor
          }
        } else {
          diffuseColor.rgb = vec3(0.42, 0.42, 0.43); // roof
        }`)
      .replace('#include <metalnessmap_fragment>', `#include <metalnessmap_fragment>
        if (isWin > 0.5) { metalnessFactor = 0.8; roughnessFactor = 0.06; }`);
  };
  return m;
}

/** Concrete sidewalk with expansion joints every 1.5 m. */
function concreteMaterial() {
  const m = new THREE.MeshStandardMaterial({ color: 0xb8b3aa, roughness: 0.95 });
  m.onBeforeCompile = (shader) => {
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWorld;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>\nvarying vec3 vWorld;\n${NOISE_GLSL}`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        vec2 g = fract(vWorld.xz / 1.5);
        float joint = step(g.x, 0.012) + step(g.y, 0.012);
        diffuseColor.rgb *= (0.92 + 0.1 * fbm(vWorld.xz * 2.0)) * (1.0 - 0.35 * min(joint, 1.0));`);
  };
  return m;
}

/** Fresh asphalt for a new path: dark, slightly mottled, with a pale edge line. */
function asphaltMaterial() {
  const m = new THREE.MeshStandardMaterial({ color: 0x3a3b3d, roughness: 0.96, polygonOffset: true, polygonOffsetFactor: -2 });
  m.onBeforeCompile = (shader) => {
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWorld;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>\nvarying vec3 vWorld;\n${NOISE_GLSL}`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        // Aggregate grain, darker repaired patches and lighter wear, like a few-years-old path.
        float grain = noise(vWorld.xz * 55.0) * 0.5 + noise(vWorld.xz * 140.0) * 0.5;
        diffuseColor.rgb *= 0.78 + 0.18 * fbm(vWorld.xz * 0.35) + 0.22 * grain;`);
  };
  return m;
}

const SOLID_LOOKS = { building_new: facadeMaterial(), sidewalk_new: concreteMaterial(), bike_path: asphaltMaterial() };

// ?debug=1 shows the existing buildings as wireframes, to check the model lines up with the photo.
const DEBUG = q.get('debug') === '1';
if (DEBUG) document.body.classList.add('debug');
const occluder = DEBUG ? new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true }) : new THREE.MeshBasicMaterial({ colorWrite: false });
// Hidden: the photo already shows the real ground, roads and parks. The render's simple posts,
// trees and buffer fill are replaced by detailed models when the render lists where they stand.
const HIDE = new Set(['ground', 'road', 'park', 'context_road', 'footprint', 'highlight', 'land', 'land_far', 'coast', 'zone_line', 'buffer']);
HIDE.add('sidewalk'); // the whole old sidewalk; widening adds 'sidewalk_new' strips instead
const DETAILED = new Set(['trunk', 'canopy', 'post']);

/** Which kind of change each part of the model shows (for telling which changes a view can see). */
const KIND_OF = {
  bike: 'add_bike_lane', buffer: 'add_bike_lane', post: 'add_bike_lane', bike_path: 'add_bike_lane', bus: 'add_bus_lane',
  building_new: 'replace_building', sidewalk_new: 'widen_sidewalk', marking: 'add_crosswalk', park_new: 'add_park',
  trunk: 'trees', canopy: 'trees',
};

function dress(root, hasProps) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    const kind = KIND_OF[o.name || o.material?.name];
    if (kind) o.userData.kind = kind;
    // Node names survive the file optimiser (which merges identical-looking materials); material names may not.
    const name = o.name || o.material?.name;
    if (DEBUG && name === 'road') {
      // Debug: the modelled roadway, to compare with the real kerbs in the photo.
      o.material = new THREE.MeshBasicMaterial({ color: 0xffd400, transparent: true, opacity: 0.6, depthTest: false });
      o.renderOrder = 50;
      return;
    }
    // Suburban lanes are plain asphalt marked by white lines and symbols, without a green fill.
    const plainLane = name === 'bike' && SETTING === 'suburban';
    if (HIDE.has(name) || (hasProps && DETAILED.has(name)) || plainLane) o.visible = false;
    else if (name === 'city_building') {
      // Existing buildings: invisible, but they hide anything behind them, on both layers.
      o.material = occluder;
      o.renderOrder = -1;
      o.layers.enable(1);
    } else if (PAINT_LOOKS[name]) {
      o.material = PAINT_LOOKS[name];
      o.layers.set(1);
      o.renderOrder = name === 'lane_line' || name === 'marking' ? 2 : 1;
    } else if (SOLID_LOOKS[name]) {
      o.material = SOLID_LOOKS[name];
      o.castShadow = name === 'building_new';
      o.receiveShadow = true;
    } else {
      // Older renders without detail: keep their simple trees and posts, just lit properly.
      o.castShadow = true;
    }
  });
}

// ---------------------------------------------------------------- detailed props
const mat4 = new THREE.Matrix4();
const quat = new THREE.Quaternion();
const up = new THREE.Vector3(0, 1, 0);
function instanced(geo, material, list, place, layer = 0) {
  if (!list.length) return null;
  const m = new THREE.InstancedMesh(geo, material, list.length);
  list.forEach((item, i) => m.setMatrixAt(i, place(item, i)));
  m.instanceMatrix.needsUpdate = true;
  m.layers.set(layer);
  return m;
}

/** Flexible delineator posts: white, with two reflective bands, on a black base. */
function addPosts(group, posts) {
  const at = ([x, n], y) => mat4.compose(world(x, n, y), quat.identity(), new THREE.Vector3(1, 1, 1)).clone();
  const white = new THREE.MeshStandardMaterial({ color: 0xf4f4f2, roughness: 0.35 });
  const band = new THREE.MeshStandardMaterial({ color: 0xc8ccd0, roughness: 0.2, metalness: 0.7 });
  const base = new THREE.MeshStandardMaterial({ color: 0x1d1d1f, roughness: 0.7 });
  const parts = [
    instanced(new THREE.CylinderGeometry(0.04, 0.045, 0.95, 12), white, posts, (p) => at(p, 0.12 + 0.475)),
    instanced(new THREE.CylinderGeometry(0.046, 0.046, 0.07, 12), band, posts, (p) => at(p, 0.12 + 0.82)),
    instanced(new THREE.CylinderGeometry(0.047, 0.047, 0.07, 12), band, posts, (p) => at(p, 0.12 + 0.68)),
    instanced(new THREE.CylinderGeometry(0.11, 0.13, 0.05, 16), base, posts, (p) => at(p, 0.12 + 0.025)),
  ];
  for (const m of parts) if (m) { m.castShadow = true; m.userData.streetDetail = true; m.userData.kind = 'add_bike_lane'; group.add(m); }
}

/** Street trees: tapered trunk, a few limbs, and a canopy of leaf clusters; soil pit at the base. */
function addTrees(group, trees, pitsToo = true) {
  const rand = mulberry(trees.length * 7919 + 13);
  const bark = new THREE.MeshStandardMaterial({ color: 0x5a4a3c, roughness: 1 });
  const leaves = new THREE.MeshStandardMaterial({ map: leafTexture, alphaTest: 0.45, side: THREE.DoubleSide, roughness: 0.9 });
  const trunk = instanced(new THREE.CylinderGeometry(0.08, 0.13, 3.6, 8).translate(0, 1.8, 0), bark, trees,
    ([x, n, s]) => mat4.compose(world(x, n, 0.1), quat.identity(), new THREE.Vector3(s, s, s)).clone());
  const limbs = [];
  for (const [x, n, s] of trees) for (let k = 0; k < 4; k++) limbs.push([x, n, s, rand() * Math.PI * 2, 0.5 + rand() * 0.35]);
  const limb = instanced(new THREE.CylinderGeometry(0.04, 0.08, 2.2, 6).translate(0, 1.1, 0), bark, limbs,
    ([x, n, s, yaw, tilt]) => mat4.compose(world(x, n, 0.1 + 2.9 * s), quat.setFromEuler(new THREE.Euler(tilt, yaw, 0, 'YXZ')), new THREE.Vector3(s, s, s)).clone());
  const PER = 240;
  const clusters = [];
  for (const [x, n, s] of trees) {
    // An irregular crown: a few overlapping lobes rather than one ball.
    const lobes = Array.from({ length: 4 + Math.floor(rand() * 3) }, () => {
      const a = rand() * Math.PI * 2;
      const r = 0.8 + rand() * 1.3;
      return [Math.cos(a) * r, Math.sin(a) * r, 4.6 + rand() * 1.8, 1.2 + rand() * 0.8];
    });
    for (let k = 0; k < PER; k++) {
      const [lx, ln, ly, lr] = lobes[k % lobes.length];
      const a = rand() * Math.PI * 2;
      const b = Math.acos(2 * rand() - 1);
      const r = Math.pow(rand(), 0.35) * lr;
      clusters.push([x + (lx + Math.cos(a) * Math.sin(b) * r) * s, n + (ln + Math.sin(a) * Math.sin(b) * r) * s, (ly + Math.cos(b) * r * 0.8) * s, s, rand()]);
    }
  }
  const leafGeo = new THREE.PlaneGeometry(0.85, 0.85);
  const canopy = instanced(leafGeo, leaves, clusters, ([x, n, y, s, k]) =>
    mat4.compose(world(x, n, y), quat.setFromEuler(new THREE.Euler(k * 6.1, k * 13.7, k * 3.3)), new THREE.Vector3(s, s, s)).clone());
  if (canopy) {
    const c = new THREE.Color();
    clusters.forEach((_, i) => canopy.setColorAt(i, c.setHSL(0.2 + rand() * 0.07, 0.2 + rand() * 0.15, 0.62 + rand() * 0.3)));
  }
  const pits = instanced(new THREE.PlaneGeometry(1.5, 1.5).rotateX(-Math.PI / 2), pitMaterial, trees,
    ([x, n]) => mat4.compose(world(x, n, 0.14), quat.identity(), new THREE.Vector3(1, 1, 1)).clone(), 1);
  for (const m of [trunk, limb, canopy]) if (m) { m.castShadow = true; m.receiveShadow = true; m.userData.kind = 'trees'; group.add(m); }
  if (pits && pitsToo) group.add(pits); // soil pits on city sidewalks; elsewhere trees stand in grass
}

/** Lane symbols painted on the road, facing the direction of travel. */
function addStencils(group, stencils) {
  const kinds = { bike: { map: bikeStencil, w: 1.1, l: 2.2 }, bus: { map: busStencil, w: 2.2, l: 8.5 } };
  for (const [kind, spec] of Object.entries(kinds)) {
    const list = stencils.filter((s) => s[3] === kind);
    const m = instanced(new THREE.PlaneGeometry(spec.w, spec.l).rotateX(-Math.PI / 2), stencilMaterial(spec.map), list,
      ([x, n, h]) => mat4.compose(world(x, n, 0.15), quat.setFromAxisAngle(up, h - Math.PI / 2), new THREE.Vector3(1, 1, 1)).clone(), 1);
    if (m) { m.renderOrder = 3; m.userData.streetDetail = true; m.userData.kind = kind === 'bus' ? 'add_bus_lane' : 'add_bike_lane'; group.add(m); }
  }
}

/** Ground that only shows the shadows new things cast onto the real street (paint layer). */
const shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(400, 400, 200, 200).rotateX(-Math.PI / 2), withTerrain(new THREE.ShadowMaterial({ opacity: 0.42, depthWrite: false })));
shadowCatcher.position.y = 0.16;
shadowCatcher.receiveShadow = true;
shadowCatcher.renderOrder = 10;
shadowCatcher.layers.set(1);
scene.add(shadowCatcher);

function mulberry(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ------------------------------------------------------------------ Street View
let pano = null;
let mode = q.get('mode') || 'after';
let split = 0.5;
let model = null;

function sync() {
  if (!pano || !origin) return;
  const pos = pano.getPosition();
  if (!pos) return;
  const pov = pano.getPov();
  const zoom = pano.getZoom() ?? 1;
  const [x, n] = project([pos.lng(), pos.lat()]);
  camera.position.set(x, groundAt(x, n) + EYE, -n);
  // Street View angles are measured in the camera car's frame, and the car is usually tilted a
  // degree or two (checked against level ground in the photos). Tilt the whole panorama about the
  // car's side-to-side axis, so looking sideways gets the matching lean instead of extra pitch.
  const car = pano.getPhotographerPov?.() ?? { heading: pov.heading, pitch: 0 };
  camera.quaternion
    .setFromAxisAngle(Y_AXIS, -car.heading * D)
    .multiply(qTmp.setFromAxisAngle(X_AXIS, car.pitch * D))
    .multiply(qTmp.setFromAxisAngle(Y_AXIS, (car.heading - pov.heading) * D))
    .multiply(qTmp.setFromAxisAngle(X_AXIS, pov.pitch * D));
  // The panorama's size (the 3D canvas is hidden unless ?debug=1, and a hidden canvas measures 0).
  const w = $('pano').clientWidth || window.innerWidth;
  const h = $('pano').clientHeight || window.innerHeight;
  const hfov = svFov(zoom);
  camera.aspect = w / h;
  camera.fov = (2 * Math.atan(Math.tan((hfov / 2) * D) / camera.aspect)) / D;
  camera.updateProjectionMatrix();
  // Keep the sun's shadow area centred on where we're standing.
  const ground = world(x, n, groundAt(x, n));
  sun.target.position.copy(ground);
  sun.position.copy(ground).addScaledVector(sunDir, 150);
  sun.target.updateMatrixWorld();
  // The 3D model is never shown on screen: it only tells Gemini where the change goes (the guides).
  // ?debug=1 still draws it, to check alignment.
  if (DEBUG) {
    camera.layers.set(1);
    paintRenderer.render(scene, camera);
    camera.layers.set(0);
    renderer.render(scene, camera);
  }
  syncPhotos();
  syncMarker();
}
let queued = false;
const requestSync = () => {
  if (queued) return;
  queued = true;
  requestAnimationFrame(() => {
    queued = false;
    sync();
  });
};

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  paintRenderer.setSize(window.innerWidth, window.innerHeight, false);
  photoRenderer.setSize(window.innerWidth, window.innerHeight, false);
  setSplit(split);
  requestSync();
}
window.addEventListener('resize', resize);

function setMode(m) {
  mode = m;
  for (const b of document.querySelectorAll('.bar button')) b.setAttribute('aria-pressed', String(b.dataset.mode === m));
  const compare = m === 'compare';
  $('divider').style.display = compare ? 'block' : 'none';
  $('lblBefore').style.display = $('lblAfter').style.display = compare ? 'block' : 'none';
  for (const c of [canvas, paintCanvas]) c.classList.toggle('on', m !== 'before' && !!model);
  setSplit(split);
  // Switching Before/Compare/After keeps this spot's photo-real photos; it just shows or hides them.
  showPhotos(!!pano && AI.pano === pano.getPano() && panoGroup.children.length > 0);
  scheduleAi();
  $('chip').textContent =
    m === 'before' ? 'Today · drag to look around, tap the street to walk'
    : m === 'after' ? 'With the change · drag to look around, tap the street to walk'
    : 'Drag the slider to compare';
}
function setSplit(f) {
  split = Math.min(0.95, Math.max(0.05, f));
  const x = split * window.innerWidth;
  $('divider').style.left = `${x}px`;
  $('divider').setAttribute('aria-valuenow', String(Math.round(split * 100)));
  for (const c of [canvas, paintCanvas, $('photo')]) c.style.clipPath = mode === 'compare' ? `inset(0 0 0 ${x}px)` : 'none';
}
for (const b of document.querySelectorAll('.bar button')) b.addEventListener('click', () => setMode(b.dataset.mode));
{
  const div = $('divider');
  let dragging = false;
  div.addEventListener('pointerdown', (e) => { dragging = true; div.setPointerCapture(e.pointerId); });
  div.addEventListener('pointermove', (e) => dragging && setSplit(e.clientX / window.innerWidth));
  div.addEventListener('pointerup', () => { dragging = false; });
  div.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') setSplit(split - 0.05);
    if (e.key === 'ArrowRight') setSplit(split + 0.05);
  });
  div.tabIndex = 0;
}

/**
 * Street View's horizontal field of view for a zoom level. Measured against Google's Street View
 * Static images of the same panorama: zoom 0.5 → 109°, 1 → 90°, 2 → 53°, which is a lens whose
 * focal length doubles each zoom step (the documented "180 / 2^zoom" is only right at zoom 1).
 */
const X_AXIS = new THREE.Vector3(1, 0, 0);
const Y_AXIS = new THREE.Vector3(0, 1, 0);
const qTmp = new THREE.Quaternion();
const svFov = (zoom) => (2 * Math.atan(Math.pow(2, 1 - zoom))) / D;

const bearing = ([lng1, lat1], [lng2, lat2]) => {
  const y = Math.sin((lng2 - lng1) * D) * Math.cos(lat2 * D);
  const x = Math.cos(lat1 * D) * Math.sin(lat2 * D) - Math.sin(lat1 * D) * Math.cos(lat2 * D) * Math.cos((lng2 - lng1) * D);
  return (Math.atan2(y, x) / D + 360) % 360;
};
const distM = (a, b) => Math.hypot((b[0] - a[0]) * D * R * Math.cos(a[1] * D), (b[1] - a[1]) * D * R);

async function start() {
  if (!(AT.length === 2 && AT.every(Number.isFinite))) return fail('error', 'No location given for this change.');
  const sv = new google.maps.StreetViewService();
  const { GOOGLE, OUTDOOR } = google.maps.StreetViewSource;
  let found = null;
  // Prefer Google's own street-level photos (they're level and at a known height), then any outdoor photo.
  for (const sources of [[GOOGLE, OUTDOOR], [OUTDOOR]]) {
    try {
      found = await sv.getPanorama({ location: { lng: AT[0], lat: AT[1] }, radius: 150, preference: google.maps.StreetViewPreference.NEAREST, sources });
      break;
    } catch {
      /* try the next, wider search */
    }
  }
  if (!found) return fail('nopano', 'Google has no Street View photos near this change.');
  const loc = found.data.location;
  // Light new things like the photo: the sun for this latitude in the month it was taken.
  const month = Number(String(found.data.imageDate || '').split('-')[1]) || 6;
  sunDir = sunFor(loc.latLng.lat(), month);
  requestSync();
  const from = [loc.latLng.lng(), loc.latLng.lat()];
  // Face the change, or along the street for changes that run along it.
  const heading = LOOK ?? (distM(from, AT) > 4 ? bearing(from, AT) : 0);
  pano = new google.maps.StreetViewPanorama($('pano'), {
    pano: loc.pano,
    pov: { heading, pitch: PITCH },
    zoom: ZOOM,
    addressControl: false,
    fullscreenControl: false,
    motionTracking: false,
    motionTrackingControl: false,
    showRoadLabels: false,
    panControl: false,
    enableCloseButton: false,
    zoomControl: false,
  });
  pano.addListener('position_changed', () => alignStreets());
  pano.addListener('position_changed', () => keepInZone());
  // Turning and zooming: redraw the photo-real views right away, inside Google's own update, so they
  // move in the same frame as the panorama. (Waiting for the next animation frame made them trail
  // the picture by a frame while dragging.)
  for (const ev of ['pov_changed', 'zoom_changed']) pano.addListener(ev, sync);
  pano.addListener('position_changed', () => {
    requestSync();
    // A new spot: drop the last spot's photos and build (or fetch saved) photos for this one.
    if (AI.pano && AI.pano !== pano.getPano()) hideAi();
    scheduleAi();
  });
  // Walking to the next photo: Google animates the move, but the new camera position arrives at
  // once, so the 3D would jump ahead of the picture. Fade it out for the animation instead.
  // Google starts its animation before it reports any change, so react to the tap itself: a tap
  // without a drag (or an arrow key) means "walk". Fade out now, and back in once the new photo
  // has settled (position_changed restarts the timer when it arrives).
  let walkTimer = 0;
  const walking = (ms) => {
    document.body.classList.add('walking');
    clearTimeout(walkTimer);
    walkTimer = setTimeout(() => document.body.classList.remove('walking'), ms);
  };
  let down = null;
  $('pano').addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; }, true);
  $('pano').addEventListener('pointerup', (e) => {
    if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 6) walking(1100);
    down = null;
  }, true);
  window.addEventListener('keydown', (e) => { if (/^(ArrowUp|ArrowDown|w|s|W|S)$/.test(e.key)) walking(1100); }, true);
  let lastPano = null;
  pano.addListener('position_changed', () => {
    const id = pano.getPano();
    if (lastPano !== null && id !== lastPano) walking(600);
    lastPano = id;
  });
  pano.addListener('status_changed', () => {
    if (pano.getStatus() !== 'OK') fail('nopano', 'Street View could not be shown here.');
  });
  tell('ready');
  setMode(mode);
  resize();
}

async function loadModel() {
  if (!GLB) return;
  const gltf = await new GLTFLoader().loadAsync(GLB);
  let o = null;
  gltf.scene.traverse((n) => { if (!o && Array.isArray(n.userData?.origin)) o = n.userData.origin; });
  origin = o ?? AT;
  let props = null;
  gltf.scene.traverse((n) => { if (!props && n.userData?.props) props = n.userData.props; });
  SETTING = props?.setting ?? 'urban';
  dress(gltf.scene, !!props);
  if (props) {
    const details = new THREE.Group();
    addPosts(details, props.posts ?? []);
    addTrees(details, props.trees ?? [], SETTING === 'urban');
    addStencils(details, props.stencils ?? []);
    applyTerrain(details);
    scene.add(details);
  }
  applyTerrain(gltf.scene);
  streetProps = props?.streets ?? [];
  gltf.scene.traverse((o) => { if (o.isMesh && STREET_NODES.has(o.name)) moving.push([o, o.position.clone()]); });
  scene.traverse((o) => { if (o.isInstancedMesh && o.userData.streetDetail) moving.push([o, o.position.clone()]); });
  alignStreets();
  let areaId = null;
  gltf.scene.traverse((n) => { if (!areaId && n.userData?.areaId) areaId = n.userData.areaId; });
  if (areaId) void loadTerrain(areaId);
  if (areaId) void loadZone(areaId);
  else ZONE.loaded = true;
  scene.add(gltf.scene);
  model = gltf.scene;
  setMode(mode);
  requestSync();
  SNAP.modelReady = true;
}

// ------------------------------------------------------------------ photo-real (AI) views you can look around in
// When you stop at a spot, the server takes Google's photos of it in four directions and has Gemini
// edit the ones where the change is visible, so the change is physically built into the photos.
// The edited photos are wrapped around you, like the panorama itself, with soft blended edges:
// turning and zooming are free, and walking to the next spot edits that one (spots you've been to
// are kept). Each direction asks only for the changes visible in it, so nothing is invented.
// canGenerate: this viewer may have new edits made (city admins at the server). Everyone else,
// such as phones, only sees views that were prepared when the request came in.
const AI = { enabled: false, canGenerate: false, on: true, timer: 0, seq: 0, pano: null, done: new Map(), mark: null, walked: false };
const VIEW_FOV = 120; // the widest Street View image (square: 120° each way)
const VIEW_PITCH = -10; // aim a little down: changes are on the ground and up from it
const VIEW_DIST = 50; // metres to the photo surface (it's drawn without depth, so any distance works)
let guideRenderer = null;

const photoCanvas = $('photo');
const photoRenderer = new THREE.WebGLRenderer({ canvas: photoCanvas, alpha: true, antialias: true });
photoRenderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
photoRenderer.setClearColor(0x000000, 0);
photoRenderer.outputColorSpace = THREE.SRGBColorSpace;
const photoScene = new THREE.Scene();
const panoGroup = new THREE.Group(); // the photos, in the camera car's frame, around the camera
photoScene.add(panoGroup);


/** Orientation of a Street View direction (heading, pitch) in the camera car's frame. */
const viewQuat = (heading, pitch) =>
  new THREE.Quaternion().setFromAxisAngle(Y_AXIS, -heading * D).multiply(new THREE.Quaternion().setFromAxisAngle(X_AXIS, pitch * D));

/** The car's tilt, as a rotation of the whole panorama (same as the 3D camera in sync()). */
function carQuat() {
  const car = pano.getPhotographerPov?.() ?? { heading: 0, pitch: 0 };
  return new THREE.Quaternion()
    .setFromAxisAngle(Y_AXIS, -car.heading * D)
    .multiply(new THREE.Quaternion().setFromAxisAngle(X_AXIS, car.pitch * D))
    .multiply(new THREE.Quaternion().setFromAxisAngle(Y_AXIS, car.heading * D));
}

/** A camera looking exactly where a Street View image (heading, pitch, square fov) looks. */
function viewCamera(heading, pitch, fov) {
  const cam = camera.clone();
  cam.quaternion.copy(carQuat()).multiply(viewQuat(heading, pitch));
  cam.aspect = 1;
  cam.fov = fov;
  cam.layers.enableAll();
  cam.updateProjectionMatrix();
  return cam;
}

/** The request's 3D model from a view's camera, on black (where things go, how big), and how much of the view it fills. */
function renderGuide(cam) {
  guideRenderer ??= new THREE.WebGLRenderer({ canvas: document.createElement('canvas'), antialias: true, preserveDrawingBuffer: true });
  guideRenderer.outputColorSpace = THREE.SRGBColorSpace;
  guideRenderer.toneMapping = THREE.ACESFilmicToneMapping;
  guideRenderer.setSize(768, 768, false);
  guideRenderer.setClearColor(0x000000, 1);
  const env = scene.environment; // belongs to the main renderer's GL context
  scene.environment = null;
  shadowCatcher.visible = false;
  guideRenderer.render(scene, cam);
  scene.environment = env;
  shadowCatcher.visible = true;
  const small = document.createElement('canvas');
  small.width = small.height = 64;
  const g = small.getContext('2d', { willReadFrequently: true });
  g.drawImage(guideRenderer.domElement, 0, 0, 64, 64);
  const px = g.getImageData(0, 0, 64, 64).data;
  let lit = 0;
  let sx = 0;
  let sy = 0;
  for (let i = 0; i < px.length; i += 4) {
    if (px[i] + px[i + 1] + px[i + 2] <= 24) continue;
    lit++;
    sx += (i / 4) % 64;
    sy += Math.floor(i / 4 / 64);
  }
  // Roughly where in the view the change sits (0–1 across and down); see changedSpot for the exact place.
  const centre = lit ? [(sx / lit + 0.5) / 64, (sy / lit + 0.5) / 64] : [0.5, 0.5];
  return { png: guideRenderer.domElement.toDataURL('image/png').split(',')[1], coverage: lit / (64 * 64), centre };
}


function showPhotos(on) {
  const ready = on && mode !== 'before';
  if (ready && !photoCanvas.classList.contains('on')) tell('photo');
  photoCanvas.classList.toggle('on', ready);
  document.body.classList.toggle('photo-ready', ready);
  requestSync();
}

/** A spot without a photo-real view: uncover the photo with the 3D model of the change on it. */
function showModelHere(message) {
  AI.pano = pano.getPano();
  progress.hide();
  cover.hide();
  showPhotos(false);
  flashChip(message);
}

/** Drop the photos of the spot we left (they stay cached on the server). */
function hideAi() {
  AI.seq++;
  AI.pano = null;
  AI.mark = null;
  $('marker').classList.remove('on');
  progress.hide();
  cover.cancel();
  clearTimeout(pollTimer);
  panoGroup.clear();
  showPhotos(false);
}

function scheduleAi() {
  clearTimeout(AI.timer);
  if (PREPARE) return; // prepare mode drives the edits itself
  if (!AI.enabled || !AI.on || mode === 'before' || !model || !pano || !origin) return;
  if (AI.pano === pano.getPano()) return; // this spot's photos are already up (turning is free)
  AI.timer = setTimeout(runAi, 700);
}

/** Which of the request's changes can be seen from a view's camera (each kind drawn alone, small). */
function visibleChanges(cam) {
  const tagged = [];
  scene.traverse((o) => { if (o.isMesh && o.visible && o.userData.kind) tagged.push(o); });
  const kinds = [...new Set(tagged.map((o) => o.userData.kind))];
  const seen = [];
  guideRenderer.setSize(64, 64, false);
  const env = scene.environment;
  scene.environment = null;
  shadowCatcher.visible = false;
  const g = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
  g.canvas.width = g.canvas.height = 64;
  for (const kind of kinds) {
    for (const o of tagged) o.visible = o.userData.kind === kind;
    guideRenderer.render(scene, cam);
    g.clearRect(0, 0, 64, 64);
    g.drawImage(guideRenderer.domElement, 0, 0);
    const px = g.getImageData(0, 0, 64, 64).data;
    let lit = 0;
    for (let i = 0; i < px.length; i += 4) if (px[i] + px[i + 1] + px[i + 2] > 24) lit++;
    if (lit >= 20) seen.push(kind); // at least ~0.5% of the view: a few far-off pixels don't count
  }
  for (const o of tagged) o.visible = true;
  scene.environment = env;
  shadowCatcher.visible = true;
  guideRenderer.setSize(768, 768, false);
  // Trees come from planting or from a new park; parking removal goes with any street change.
  const ops = new Set();
  for (const k of seen) {
    if (k === 'trees') ['plant_trees', 'add_park'].filter((t) => OPS.has(t)).forEach((t) => ops.add(t));
    else if (OPS.has(k)) ops.add(k);
  }
  if (OPS.has('remove_parking') && (ops.has('add_bike_lane') || ops.has('add_bus_lane'))) ops.add('remove_parking');
  return [...ops];
}

/** The parts of the request's description that are about these changes. */
// Whole words only ("Street" contains "tree").
const DESC_MATCH = {
  add_bike_lane: /\bbike (lane|path)/i, add_bus_lane: /\bbus lane/i, plant_trees: /\btrees?\b/i, add_park: /\bnew park\b/i,
  replace_building: /\brebuild\b/i, widen_sidewalk: /\bwiden sidewalks?\b/i, add_crosswalk: /\bcrosswalk\b/i, remove_parking: /\bremove parking\b/i,
};
function descFor(ops) {
  const parts = DESC.split(/;\s*/).filter((d) => ops.some((op) => DESC_MATCH[op]?.test(d)));
  return parts.length ? parts.join('; ') : DESC;
}

/** How far (degrees) you'd have to turn from where you're looking to face `heading`. */
function turn(heading) {
  const d = Math.abs((((heading - pano.getPov().heading) % 360) + 540) % 360 - 180);
  return d;
}

const MIN_DIRECTION = 0.01; // a direction is edited when the change fills at least 1% of it

/**
 * The directions worth editing at the current spot: four directions starting straight down the
 * street, each with its guide and the changes visible in it (directions with none are left out).
 */
function planSpot() {
  sync();
  const car = pano.getPhotographerPov?.()?.heading ?? 0;
  return [0, 90, 180, 270]
    .map((k) => {
      const heading = (car + k + 360) % 360;
      const cam = viewCamera(heading, VIEW_PITCH, VIEW_FOV);
      const guide = renderGuide(cam);
      const ops = guide.coverage > MIN_DIRECTION ? visibleChanges(cam) : [];
      return { heading, pitch: VIEW_PITCH, ...guide, ops };
    })
    .filter((v) => v.coverage > MIN_DIRECTION && v.ops.length);
}

/**
 * Ask the server for one direction's edit. Returns its image URL, or null when it hasn't been
 * prepared and this viewer can't have new ones made. Remembers it for this visit.
 */
async function requestEdit(panoId, v, at) {
  const res = await fetch('/ai/render', {
    method: 'POST',
    headers: { 'content-type': 'application/json', ...(TOKEN ? { authorization: `Bearer ${TOKEN}` } : {}) },
    body: JSON.stringify({ pano: panoId, heading: v.heading, pitch: v.pitch, fov: VIEW_FOV, aspect: '1:1', guide: v.png, ops: v.ops, desc: descFor(v.ops), model: GLB, setting: SETTING, at }),
  });
  const body = await res.json().catch(() => ({}));
  if (res.status === 401) throw new Error('sign in to see photo-real views');
  if (res.status === 404 && !AI.canGenerate) return null;
  // Over the daily (or per-minute) limit: only new edits are refused; saved ones still come back.
  if (res.status === 429) throw Object.assign(new Error(body.error || 'limit reached'), { limit: true });
  if (!res.ok) throw new Error(body.error || `render failed (${res.status})`);
  const list = EDITS.get(panoId) ?? [];
  if (!list.some((e) => e.url === body.url)) list.push({ heading: v.heading, pitch: v.pitch, fov: VIEW_FOV, ops: v.ops, url: body.url, at });
  EDITS.set(panoId, list);
  return body.url;
}

// ------------------------------------------------------------------ the whole zone's edits
// Every edit already made for this request, by Street View spot (from /ai/edits). The zone is
// prepared when the request comes in, so walking around just loads these: nothing is made on the
// spot, and the spots around you are downloaded before you get there.
const EDITS = new Map();
const editsLoaded = fetch(`/ai/edits?model=${encodeURIComponent(GLB || '')}`)
  .then((r) => (r.ok ? r.json() : { spots: {} }))
  .then((j) => { for (const [id, list] of Object.entries(j.spots || {})) EDITS.set(id, list); })
  .catch(() => {});
const PRELOAD_M = 45; // download the edits of spots this close, so walking to them is instant
const preloaded = new Set();
function preloadAround() {
  const pos = pano?.getPosition();
  if (!pos) return;
  const here = [pos.lng(), pos.lat()];
  const near = new Set((pano.getLinks() ?? []).map((l) => l.pano));
  for (const [id, list] of EDITS) {
    for (const e of list) {
      if (preloaded.has(e.url)) continue;
      if (!near.has(id) && !(e.at && distM(here, e.at) < PRELOAD_M)) continue;
      preloaded.add(e.url);
      new Image().src = e.url; // the files never change, so the browser keeps them
    }
  }
}

/** Fetch the request's edit list again (more may have been made since the page opened). */
async function refreshEdits() {
  try {
    const r = await fetch(`/ai/edits?model=${encodeURIComponent(GLB || '')}`);
    if (!r.ok) return;
    for (const [id, list] of Object.entries((await r.json()).spots || {})) EDITS.set(id, list);
  } catch {}
}

/** Keep the cover up with a message, and check every 10 s for edits; show them as soon as they exist. */
let pollTimer = 0;
function waitForEdits(text) {
  cover.say(text);
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    await refreshEdits();
    if (stepToViewpoint()) return; // moved to a ready spot: it loads itself
    if (EDITS.get(pano.getPano())?.length || AI.canGenerate) scheduleAi();
    else waitForEdits(text);
  }, 10000);
}

async function runAi() {
  const seq = ++AI.seq;
  AI.shown = [];
  const panoId = pano.getPano();
  const pos = pano.getPosition();
  const at = pos ? [pos.lng(), pos.lat()] : undefined;
  // Already made for this spot (prepared with the zone, or earlier): just load them.
  const saved = EDITS.get(panoId);
  // Walked to a spot with no photo-real view (and none can be made for this viewer): show the 3D
  // model of the change over the photo instead of covering it.
  if (AI.walked && !saved?.length && !AI.canGenerate) {
    showModelHere('No photo-real view at this spot · showing the 3D model of the change');
    return 0;
  }
  const views = (saved?.length ? saved.map((e) => ({ ...e, coverage: 0 })) : planSpot())
    // The direction you're facing first, so the view in front of you is ready soonest.
    .sort((a, b) => turn(a.heading) - turn(b.heading));
  if (!views.length) {
    if (AI.walked) {
      showModelHere('The change can’t be seen from this spot');
      return 0;
    }
    // Nothing to see here: go to a prepared viewpoint if there is one, else say so (never the plain photo).
    if (!stepToViewpoint()) cover.say('The change can’t be seen from the nearest Street View photo.', { spin: false });
    return 0;
  }
  if (cover.on) cover.say(COVER_LOADING);
  AI.pano = panoId;
  panoGroup.clear();
  const started = performance.now();
  // Each direction is edited on its own, with only the changes it can see. (Giving Gemini a
  // neighbouring edited direction as a reference made it copy that view's layout, so we don't.)
  // All directions at once (the server retries any that hit Google's per-minute limit); each one
  // appears as soon as it's ready.
  let ready = 0;
  let failed = null;
  let limited = 0; // directions not made because of the daily limit
  let missing = 0; // not prepared (viewers who can't have new edits made)
  const shown = [];
  progress.start(views.length);
  if (!cover.on && !PREPARE) cover.show(700); // a spot that has to be built (prepared ones beat this)
  await Promise.all(
    views.map(async (v, i) => {
      try {
        const url = v.url ?? (await requestEdit(panoId, v, at));
        if (seq !== AI.seq) return; // walked on
        if (!url) {
          missing++;
          progress.step(ready + missing);
          return;
        }
        const tex = await new THREE.TextureLoader().loadAsync(url);
        if (seq !== AI.seq) return;
        tex.colorSpace = THREE.SRGBColorSpace;
        Object.assign(v, changedSpot(tex.image));
        const size = 2 * VIEW_DIST * Math.tan((VIEW_FOV / 2) * D);
        const q = viewQuat(v.heading, v.pitch);
        const quad = new THREE.Mesh(
          new THREE.PlaneGeometry(size, size),
          // The image is transparent wherever the edit left the photo unchanged (the server works that
          // out), so Google's full-resolution panorama shows there and only what changed is replaced.
          new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false, toneMapped: false }),
        );
        quad.quaternion.copy(q);
        quad.position.copy(new THREE.Vector3(0, 0, -VIEW_DIST).applyQuaternion(q));
        quad.renderOrder = views.length - i; // the most important direction on top where they overlap
        panoGroup.add(quad);
        showPhotos(true);
        shown.push(v);
        ready++;
        progress.step(ready + missing);
      } catch (e) {
        if (e.limit) limited++;
        else failed ??= e;
        progress.step(ready + missing + limited + (e.limit ? 0 : 1));
      }
    }),
  );
  if (seq !== AI.seq) return;
  AI.shown = shown;
  progress.end();
  if (ready && performance.now() - started > 5000) progress.learn(performance.now() - started); // a fresh spot, not a saved one
  if (ready && !PREPARE) pointAt(shown);
  if (!PREPARE) preloadAround();
  if (ready) {
    cover.hide();
    AI.walked = true; // the first photo-real view is up: from now on you can walk anywhere
  }
  if (!ready && missing && AI.walked) {
    showModelHere('No photo-real view at this spot · showing the 3D model of the change');
    return 0;
  }
  if (!ready && missing) {
    AI.pano = null;
    waitForEdits('The photo-real view of this request is still being prepared. It will appear here as soon as it’s ready.');
    return 0;
  }
  // The limit only stops new edits: whatever was already made is shown, without an error.
  if (!ready && limited && !failed) {
    AI.pano = null;
    waitForEdits('The photo-real view of this request hasn’t been made yet (today’s limit of new edits was reached). It will appear here once it’s made.');
    return 0;
  }
  if (failed) {
    progress.end();
    // A setup problem (no Gemini billing, missing key) won't fix itself: stop trying this visit and
    // say why once, instead of an error every time you stop.
    const setup = /free tier|limit: 0|billing|not set up|permission|api key/i.test(failed.message);
    if (setup) AI.enabled = false;
    if (!ready) {
      AI.pano = null;
      const retry = { label: 'Try again', run: () => { cover.say(COVER_LOADING); scheduleAi(); } };
      cover.say(setup ? 'Photo-real views are unavailable right now.' : `The photo-real view couldn’t be loaded: ${failed.message.slice(0, 120)}`, { spin: false, action: setup ? null : retry });
    } else {
      flashChip(`Part of the photo-real view failed: ${failed.message.slice(0, 120)}`);
    }
    tell('ai-error', failed.message);
    if (PREPARE) throw failed;
    return ready;
  }
  flashChip('Photo-real (AI) · look around and walk anywhere in this zone');
  return ready;
}

// ------------------------------------------------------------------ prepare mode (?prepare=N&edits=M)
// The server opens this page in a hidden browser as soon as a request comes in, to make its
// photo-real edits ahead of time. Each Street View spot is its own photo, so every spot shown needs
// its own edits; to keep that cheap, only *viewpoints* are prepared: spots ~25 m apart, inside the
// zone (plus a small margin), where the change is clearly visible, nearest the change first, until
// the request's edit budget (M) is used. Viewers open on a viewpoint and can walk anywhere in the
// zone; spots between viewpoints show the 3D model of the change (see showModelHere). Edits are made in the background,
// several at once, while the walk carries on. Edits already made count towards the budget, so
// running it again only fills in what's missing. Reports { done, spots, edited } on
// window.__prepared.
const PREPARE = Number(q.get('prepare') || 0);
const EDIT_BUDGET = Number(q.get('edits') || 15);
if (PREPARE || DEBUG || mode === 'before') cover.hide(); // nothing to wait for
const PREPARE_PARALLEL = 6; // edits in flight at once (the server rotates models when Google is busy)
const VIEWPOINT_SPACING_M = 25;
const MIN_VIEWPOINT = 0.02; // a spot is a viewpoint when the change fills 2% of some direction
const NEAR_CHANGE_M = 70; // used instead of the zone when its box can't be had
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(test, ms = 60000) {
  const end = Date.now() + ms;
  while (!test()) {
    if (Date.now() > end) throw new Error('timed out');
    await wait(200);
  }
}
async function prepareRun() {
  try {
    await until(() => pano && pano.getPosition() && model && origin && ZONE.loaded, 90000);
    await editsLoaded;
    const inside = (p) => (ZONE.box ? inZone(p) : distM(p, AT) <= NEAR_CHANGE_M);
    const viewpoints = [...EDITS.values()].map((list) => list.find((e) => e.at)?.at).filter(Boolean);
    let planned = [...EDITS.values()].reduce((t, list) => t + list.length, 0);
    const visited = new Set();
    const queue = [pano.getPano()];
    const jobs = [];
    let active = 0;
    let spots = 0;
    let edited = 0;
    let failures = 0;
    let setupError = null;
    let limited = 0;
    let snapped = !SNAPS; // the first viewpoint's petition pictures are taken once its edits are in
    while (queue.length && spots < PREPARE && planned < EDIT_BUDGET && !setupError) {
      const id = queue.shift();
      if (visited.has(id)) continue;
      visited.add(id);
      if (pano.getPano() !== id) {
        pano.setPano(id);
        await until(() => pano.getPano() === id && pano.getPosition());
        await wait(1000); // let the photographer's direction and links arrive
      }
      const pos = pano.getPosition();
      const at = [pos.lng(), pos.lat()];
      if (!inside(at) && visited.size > 1) continue; // outside the zone: don't edit it or walk on from it
      spots++;
      for (const l of pano.getLinks() ?? []) if (!visited.has(l.pano)) queue.push(l.pano);
      if (EDITS.get(id)?.length) {
        if (!snapped) { await runAi(); await snapPause(); snapped = true; }
        continue; // already a viewpoint
      }
      if (viewpoints.some((v) => distM(v, at) < VIEWPOINT_SPACING_M)) continue; // one close by is enough
      const views = planSpot();
      if (!views.some((v) => v.coverage >= MIN_VIEWPOINT)) continue; // only a glimpse of it from here
      if (planned + views.length > EDIT_BUDGET) break; // a viewpoint is all its directions or none
      viewpoints.push(at);
      planned += views.length;
      for (const v of views) {
        while (active >= PREPARE_PARALLEL) await wait(100);
        active++;
        jobs.push(
          requestEdit(id, v, at)
            .then((url) => { if (url) edited++; })
            .catch((e) => {
              if (e.limit) return void limited++; // only new edits are refused; carry on so saved ones are all listed
              failures++;
              // A setup problem (no billing, missing key) won't fix itself: stop.
              if (/free tier|limit: 0|billing|not set up|permission|api key/i.test(e.message)) setupError = e;
            })
            .finally(() => active--),
        );
      }
      if (!snapped) {
        // The first viewpoint's edits count toward EDIT_BUDGET just like every other one.
        await Promise.all(jobs);
        if (EDITS.get(id)?.length) await runAi(); // loads saved edits; never generates extra directions
        await snapPause();
        snapped = true;
      }
    }
    await Promise.all(jobs);
    await snapAtViewpoint();
    if (setupError) throw setupError;
    const result = { done: true, spots: viewpoints.length, edited, failures };
    // Not finished: say so, so "Prepare again" makes the rest once the limit resets.
    if (limited) result.error = `Daily limit reached with ${limited} edit${limited === 1 ? '' : 's'} still to make. Prepare again after it resets (midnight UTC).`;
    window.__prepared = result;
  } catch (e) {
    if (SNAPS && !SNAP.firstSpot) await snapPause().catch(() => {});
    window.__prepared = { done: true, error: String(e?.message || e) };
  }
}

// ------------------------------------------------------------------ walking between viewpoints
// Only viewpoints are prepared, so a step that lands between them carries on to the nearest
// viewpoint (other than the one you left) within reach. Every place you can stand shows the change,
// and nothing is ever made while you walk. A step past the last viewpoint takes you back to it.
/**
 * Go to the prepared viewpoint nearest here, anywhere in the zone (on opening, or while waiting
 * for the first photo-real view). Walking itself is free: spots without photo-real views show the
 * 3D model of the change. Returns true when it sends you somewhere else.
 */
function stepToViewpoint() {
  if (PREPARE || !pano || !EDITS.size) return false;
  const id = pano.getPano();
  const pos = pano.getPosition();
  if (!id || !pos) return false;
  if (EDITS.get(id)?.length) return false;
  const here = [pos.lng(), pos.lat()];
  let best = null;
  let bestD = Infinity;
  for (const [vid, list] of EDITS) {
    const at = list.find((e) => e.at)?.at;
    if (!at || vid === id || (ZONE.box && !inZone(at))) continue;
    const d = distM(here, at);
    if (d < bestD) [best, bestD] = [vid, d];
  }
  if (!best) return false;
  pano.setPano(best);
  return true;
}

// ------------------------------------------------------------------ staying inside the zone
// A request is shown inside its zone only: that's what's prepared. Walking past the edge (with a
// small margin, so streets along the edge stay walkable) takes you back to where you were.
const ZONE_MARGIN_M = 30;
const ZONE = { box: null, loaded: false };
async function loadZone(areaId) {
  try {
    const r = await fetch(`/areas/${encodeURIComponent(areaId)}/bbox`);
    if (r.ok) ZONE.box = (await r.json()).bbox;
  } catch {}
  ZONE.loaded = true;
}
function inZone([lng, lat]) {
  const [w, s, e, n] = ZONE.box;
  const mLat = ZONE_MARGIN_M / 111195;
  const mLng = mLat / Math.cos(lat * D);
  return lng >= w - mLng && lng <= e + mLng && lat >= s - mLat && lat <= n + mLat;
}
let lastInZone = null;
/** Called when the panorama moves: walking out of the zone puts you back. */
/** Returns true when it sends you back. */
function keepInZone() {
  if (PREPARE || !ZONE.box || !pano) return false;
  const id = pano.getPano();
  const pos = pano.getPosition();
  if (!id || !pos) return false;
  if (inZone([pos.lng(), pos.lat()]) || !lastInZone) {
    lastInZone = id; // (the first spot counts as inside, even just past the edge)
    return false;
  }
  if (id === lastInZone) return false;
  pano.setPano(lastInZone);
  flashChip('That’s the edge of this zone. The change is shown inside the zone only.');
  return true;
}

/** Called from sync(): keep the photos around the camera, tilted with the car, and draw them. */
function syncPhotos() {
  if (!panoGroup.children.length) return;
  panoGroup.position.copy(camera.position);
  panoGroup.quaternion.copy(carQuat());
  photoRenderer.render(photoScene, camera);
}

/** Show a message for a few seconds, then go back to the usual hint for the current mode. */
let chipTimer = 0;
function flashChip(text) {
  $('chip').textContent = text;
  clearTimeout(chipTimer);
  chipTimer = setTimeout(() => setModeHint(), 6000);
}
function setModeHint() {
  $('chip').textContent =
    mode === 'before' ? 'Today · drag to look around, tap the street to walk'
    : mode === 'after' ? 'With the change · drag to look around, tap the street to walk'
    : 'Drag the slider to compare';
}

/**
 * The progress bar while a spot's photo-real view is made. Times measured on the server: one
 * direction made fresh takes ~15–20 s, and a spot's directions are made side by side, so a whole
 * spot takes ~20–25 s (longer when Google is busy). A spot prepared ahead of time loads in ~2 s.
 * The estimate adjusts to how long spots actually take on this computer.
 */
const progress = (() => {
  const FRESH_MS = 22000;
  const SAVED_MS = 2000;
  let typical = FRESH_MS;
  try { typical = Number(localStorage.getItem('sv.spotMs')) || FRESH_MS; } catch {}
  let t0 = 0, total = 0, done = 0, timer = 0;
  const draw = () => {
    const el = performance.now() - t0;
    // Viewers who only see prepared views never wait for a fresh edit.
    const expect = AI.canGenerate ? typical : SAVED_MS;
    const part = Math.min(0.95, el / expect);
    const pct = Math.min(1, (done + (total - done) * part) / total);
    const left = expect - el;
    $('progFill').style.width = `${(pct * 100).toFixed(1)}%`;
    $('progress').setAttribute('aria-valuenow', String(Math.round(pct * 100)));
    $('progTitle').textContent = AI.canGenerate ? 'Building the photo-real view' : 'Loading the photo-real view';
    $('progLeft').textContent =
      done >= total ? 'Done'
      : el < 1500 ? 'Checking saved views…'
      : left > 1000 ? `About ${Math.ceil(left / 1000)} s left`
      : 'Almost done…';
    $('progSub').textContent =
      `${done} of ${total} direction${total === 1 ? '' : 's'} ready`
      + (el > expect + 10000 ? ' · taking longer than usual (Google is busy)' : AI.canGenerate ? ` · usually about ${Math.round(typical / 1000)} s` : '');
  };
  return {
    start(n) {
      total = n;
      done = 0;
      t0 = performance.now();
      clearInterval(timer);
      timer = setInterval(draw, 250);
      draw();
      $('progress').classList.add('on');
    },
    step(n) {
      done = Math.min(total, n);
      draw();
    },
    end() {
      clearInterval(timer);
      done = total;
      draw();
      setTimeout(() => $('progress').classList.remove('on'), 500);
    },
    hide() {
      clearInterval(timer);
      $('progress').classList.remove('on');
    },
    /** Remember how long a fresh spot took, so the next estimate is closer. */
    learn(ms) {
      typical = Math.round(0.7 * typical + 0.3 * Math.min(90000, ms));
      try { localStorage.setItem('sv.spotMs', String(typical)); } catch {}
    },
  };
})();

const OP_NAMES = {
  add_bike_lane: 'New bike lane', add_bus_lane: 'New bus lane', plant_trees: 'New trees', add_park: 'New park',
  replace_building: 'New building', widen_sidewalk: 'Wider sidewalk', add_crosswalk: 'New crosswalk', remove_parking: 'Parking removed',
};

/**
 * Where an edit changed the photo. The edit is see-through wherever the photo stayed the same, so
 * its solid pixels are what changed. Returns how much changed and the middle of the densest patch
 * of change (the new lane itself, rather than a parked car the edit touched up beside it).
 */
function changedSpot(img) {
  const N = 64;
  const C = 8; // patch size, px
  const g = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
  g.canvas.width = g.canvas.height = N;
  g.drawImage(img, 0, 0, N, N);
  const px = g.getImageData(0, 0, N, N).data;
  // The very bottom of the image is the road right under the camera car (blurred): leave it out.
  const rows = Math.round(N * 0.92);
  const grid = new Float32Array((N / C) * (N / C));
  let changed = 0;
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < N; x++) {
      if (px[(y * N + x) * 4 + 3] <= 128) continue;
      changed++;
      grid[Math.floor(y / C) * (N / C) + Math.floor(x / C)]++;
    }
  }
  if (!changed) return { changed: 0 };
